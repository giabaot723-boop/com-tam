<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CƠM TẤM SÀI GÒN</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    scroll-behavior:smooth;
}

body{
    font-family:'Poppins',sans-serif;
    background:#faf7f2;
    color:#2b211c;
}

/* ===== NAVBAR ===== */

.navbar{
    position:fixed;
    top:0;
    width:100%;
    z-index:1000;
    background:rgba(38,25,19,.96);
    backdrop-filter:blur(12px);
    padding:17px 7%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    box-shadow:0 4px 20px rgba(0,0,0,.15);
}

.logo{
    color:#e9c46a;
    font-family:'Playfair Display',serif;
    font-size:25px;
    font-weight:bold;
    letter-spacing:1px;
}

.logo span{
    color:white;
}

.nav-links{
    display:flex;
    gap:30px;
    list-style:none;
}

.nav-links a{
    color:white;
    text-decoration:none;
    font-size:14px;
    transition:.3s;
}

.nav-links a:hover{
    color:#e9c46a;
}

.cart-btn{
    background:#e9c46a;
    color:#261913;
    border:0;
    padding:11px 17px;
    border-radius:25px;
    font-weight:bold;
    cursor:pointer;
}

/* ===== HERO ===== */

.hero{
    min-height:100vh;
    display:flex;
    align-items:center;
    padding:120px 8% 70px;
    position:relative;
    overflow:hidden;

    background:
    linear-gradient(90deg,
    rgba(36,22,16,.96) 0%,
    rgba(36,22,16,.80) 45%,
    rgba(36,22,16,.25) 100%),
    url("https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?auto=format&fit=crop&w=1800&q=85");

    background-size:cover;
    background-position:center;
}

.hero-content{
    max-width:650px;
    color:white;
    animation:fadeUp 1s ease;
}

.small-title{
    color:#e9c46a;
    text-transform:uppercase;
    letter-spacing:4px;
    font-size:13px;
    font-weight:600;
    margin-bottom:18px;
}

.hero h1{
    font-family:'Playfair Display',serif;
    font-size:clamp(48px,7vw,82px);
    line-height:1.05;
    margin-bottom:22px;
}

.hero h1 span{
    color:#e9c46a;
}

.hero p{
    color:#eee;
    font-size:17px;
    line-height:1.8;
    max-width:550px;
    margin-bottom:30px;
}

.hero-buttons{
    display:flex;
    gap:15px;
    flex-wrap:wrap;
}

.btn-primary,
.btn-outline{
    padding:14px 26px;
    border-radius:30px;
    text-decoration:none;
    font-weight:600;
    transition:.3s;
}

.btn-primary{
    background:#e9c46a;
    color:#261913;
}

.btn-primary:hover{
    transform:translateY(-3px);
    box-shadow:0 10px 25px rgba(233,196,106,.3);
}

.btn-outline{
    border:1px solid #e9c46a;
    color:#e9c46a;
}

.btn-outline:hover{
    background:#e9c46a;
    color:#261913;
}

/* ===== GENERAL ===== */

section{
    padding:90px 8%;
}

.section-title{
    text-align:center;
    margin-bottom:50px;
}
  .section-title .mini{
    color:#a86b32;
    font-size:13px;
    letter-spacing:3px;
    font-weight:bold;
}

.section-title h2{
    font-family:'Playfair Display',serif;
    font-size:44px;
    margin-top:10px;
}

.section-title p{
    color:#777;
    margin-top:10px;
}

/* ===== FEATURES ===== */

.features{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:25px;
    margin-top:-40px;
    position:relative;
    z-index:5;
}

.feature{
    background:white;
    padding:30px;
    text-align:center;
    border-radius:16px;
    box-shadow:0 15px 40px rgba(48,29,20,.09);
}

.feature-icon{
    font-size:35px;
    margin-bottom:12px;
}

.feature h3{
    font-family:'Playfair Display',serif;
    font-size:22px;
    margin-bottom:8px;
}

.feature p{
    color:#777;
    font-size:14px;
}

/* ===== MENU ===== */

.menu{
    background:#fff;
}

.menu-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:28px;
}

.food-card{
    background:#faf7f2;
    border-radius:18px;
    overflow:hidden;
    transition:.35s;
    border:1px solid #eee5dc;
}

.food-card:hover{
    transform:translateY(-8px);
    box-shadow:0 20px 40px rgba(50,30,20,.12);
}

.food-img{
    height:230px;
    background-size:cover;
    background-position:center;
    position:relative;
}

.badge{
    position:absolute;
    top:15px;
    left:15px;
    background:#261913;
    color:#e9c46a;
    padding:7px 12px;
    border-radius:20px;
    font-size:11px;
    font-weight:bold;
}

.food-info{
    padding:22px;
}

.food-info h3{
    font-family:'Playfair Display',serif;
    font-size:23px;
    margin-bottom:8px;
}

.food-info p{
    color:#777;
    font-size:13px;
    line-height:1.7;
    min-height:45px;
}

.food-bottom{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:18px;
}

.price{
    color:#9b5e26;
    font-size:20px;
    font-weight:bold;
}

.add-btn{
    border:0;
    background:#261913;
    color:white;
    padding:10px 15px;
    border-radius:25px;
    cursor:pointer;
    transition:.3s;
}

.add-btn:hover{
    background:#9b5e26;
}

/* ===== ABOUT ===== */

.about{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:70px;
    align-items:center;
}

.about-img{
    min-height:500px;
    border-radius:20px;
    background:
    url("https://images.unsplash.com/photo-1515003197210-e0cd71810b5f?auto=format&fit=crop&w=1000&q=85")
    center/cover;
    box-shadow:20px 20px 0 #e9c46a;
}

.about-text .mini{
    color:#a86b32;
    letter-spacing:3px;
    font-size:13px;
    font-weight:bold;
}

.about-text h2{
    font-family:'Playfair Display',serif;
    font-size:45px;
    line-height:1.15;
    margin:15px 0 20px;
}

.about-text p{
    color:#666;
    line-height:1.9;
    margin-bottom:15px;
}

.check{
    margin-top:20px;
    line-height:2;
}

.check span{
    color:#a86b32;
    font-weight:bold;
}

/* ===== REVIEWS ===== */

.reviews{
    background:#261913;
    color:white;
}
  .reviews .section-title p{
    color:#bbb;
}

.reviews .section-title h2{
    color:white;
}

.review-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:25px;
}

.review{
    background:#34251e;
    padding:28px;
    border-radius:16px;
}

.stars{
    color:#e9c46a;
    margin-bottom:15px;
}

.review p{
    color:#ddd;
    line-height:1.8;
    font-size:14px;
}

.user{
    margin-top:20px;
    font-weight:bold;
}

/* ===== CONTACT ===== */

.contact{
    text-align:center;
}

.contact-box{
    max-width:800px;
    margin:auto;
    background:#261913;
    color:white;
    border-radius:20px;
    padding:50px 30px;
}

.contact-box h2{
    font-family:'Playfair Display',serif;
    font-size:38px;
    margin-bottom:15px;
}

.contact-box p{
    color:#ccc;
    margin-bottom:25px;
}

/* ===== FOOTER ===== */

footer{
    background:#18100d;
    color:#aaa;
    text-align:center;
    padding:30px;
    font-size:13px;
}

footer strong{
    color:#e9c46a;
}

/* ===== CART ===== */

.cart-panel{
    position:fixed;
    top:0;
    right:-420px;
    width:390px;
    max-width:90%;
    height:100vh;
    background:white;
    z-index:2000;
    box-shadow:-10px 0 40px rgba(0,0,0,.2);
    transition:.4s;
    padding:25px;
    display:flex;
    flex-direction:column;
}

.cart-panel.active{
    right:0;
}

.cart-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding-bottom:20px;
    border-bottom:1px solid #eee;
}

.cart-header h2{
    font-family:'Playfair Display',serif;
}

.close-cart{
    border:0;
    background:none;
    font-size:25px;
    cursor:pointer;
}

.cart-items{
    flex:1;
    overflow:auto;
    padding:20px 0;
}

.cart-item{
    display:flex;
    justify-content:space-between;
    gap:10px;
    padding:14px 0;
    border-bottom:1px solid #eee;
}

.cart-item h4{
    font-size:14px;
}

.cart-item small{
    color:#999;
}

.qty{
    display:flex;
    align-items:center;
    gap:8px;
}

.qty button{
    width:25px;
    height:25px;
    border:0;
    border-radius:50%;
    cursor:pointer;
}

.cart-total{
    border-top:1px solid #ddd;
    padding-top:20px;
}

.total-row{
    display:flex;
    justify-content:space-between;
    font-weight:bold;
    font-size:20px;
    margin-bottom:20px;
}

.checkout{
    width:100%;
    border:0;
    padding:15px;
    border-radius:30px;
    background:#9b5e26;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

/* ===== OVERLAY ===== */

.overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.5);
    z-index:1500;
    opacity:0;
    visibility:hidden;
    transition:.3s;
}

.overlay.active{
    opacity:1;
    visibility:visible;
}

/* ===== ANIMATION ===== */

@keyframes fadeUp{
    from{
        opacity:0;
        transform:translateY(30px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* ===== MOBILE ===== */

@media(max-width:800px){

    .nav-links{
        display:none;
    }

    .navbar{
    padding:15px 5%;
    }

    .hero{
        padding:120px 7% 70px;
        background-position:center;
    }

    .hero h1{
        font-size:52px;
    }

    .features{
        grid-template-columns:1fr;
        margin:20px 7%;
    }

    .menu-grid{
        grid-template-columns:1fr;
    }

    .about{
        grid-template-columns:1fr;
        gap:40px;
    }

    .about-img{
        min-height:350px;
    }

    .review-grid{
        grid-template-columns:1fr;
    }

    section{
        padding:70px 7%;
    }

    .section-title h2{
        font-size:36px;
    }
}
</style>
</head>

<body>

<!-- NAVBAR -->

<nav class="navbar">

    <div class="logo">
        CƠM TẤM <span>SÀI GÒN</span>
    </div>

    <ul class="nav-links">
        <li><a href="#home">Trang chủ</a></li>
        <li><a href="#menu">Thực đơn</a></li>
        <li><a href="#about">Về chúng tôi</a></li>
        <li><a href="#reviews">Đánh giá</a></li>
        <li><a href="#contact">Liên hệ</a></li>
    </ul>

    <button class="cart-btn" onclick="openCart()">
