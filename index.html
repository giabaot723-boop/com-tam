<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cơm Tấm Luxury</title>

<style>

/* =========================
   RESET
========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Arial, Helvetica, sans-serif;
    background:#f8f3ea;
    color:#2b1b14;
}

button{
    font-family:inherit;
}

a{
    text-decoration:none;
}


/* =========================
   NAVBAR
========================= */

.navbar{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:75px;
    z-index:999;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 7%;

    background:rgba(27,17,13,.96);
    border-bottom:1px solid rgba(221,175,79,.25);

    backdrop-filter:blur(12px);
}

.logo{
    color:#e4b95e;
    font-family:Georgia,serif;
    font-size:25px;
    font-weight:bold;
}

.logo span{
    color:#fff;
}

.nav-menu{
    display:flex;
    align-items:center;
    gap:30px;
}

.nav-menu a{
    color:#eee;
    font-size:14px;
    transition:.3s;
}

.nav-menu a:hover{
    color:#e4b95e;
}

.cart-button{
    border:1px solid #e4b95e;
    background:#e4b95e;
    color:#24150f;

    padding:10px 17px;
    border-radius:30px;

    cursor:pointer;
    font-weight:bold;

    transition:.3s;
}

.cart-button:hover{
    transform:translateY(-2px);
    box-shadow:0 7px 20px rgba(228,185,94,.25);
}


/* =========================
   HERO
========================= */

.hero{
    min-height:100vh;

    padding:130px 8% 80px;

    display:flex;
    align-items:center;

    position:relative;
    overflow:hidden;

    background:
        radial-gradient(
            circle at 80% 20%,
            rgba(228,185,94,.20),
            transparent 25%
        ),
        radial-gradient(
            circle at 20% 90%,
            rgba(139,75,37,.25),
            transparent 30%
        ),
        linear-gradient(
            135deg,
            #180e0a,
            #352018 50%,
            #120a07
        );
}

.hero::before{
    content:"";
    position:absolute;

    width:500px;
    height:500px;

    right:-180px;
    top:-160px;

    border:1px solid rgba(228,185,94,.18);
    border-radius:50%;
}

.hero::after{
    content:"";
    position:absolute;

    width:350px;
    height:350px;

    right:-90px;
    top:-80px;

    border:1px solid rgba(228,185,94,.12);
    border-radius:50%;
}

.hero-content{
    max-width:720px;
    position:relative;
    z-index:2;
}

.eyebrow{
    color:#e4b95e;

    font-size:13px;
    font-weight:bold;

    letter-spacing:4px;
    text-transform:uppercase;

    margin-bottom:20px;
}

.hero h1{
    color:#fff;

    font-family:Georgia,serif;

    font-size:clamp(48px,7vw,82px);
    line-height:1.03;

    margin-bottom:25px;
}

.hero h1 span{
    color:#e4b95e;
}

.hero-description{
    color:#d8d1cb;

    max-width:600px;
    line-height:1.9;
    font-size:16px;

    margin-bottom:35px;
}

.hero-buttons{
    display:flex;
    gap:15px;
    flex-wrap:wrap;
}

.btn-gold{
    display:inline-block;

    background:#e4b95e;
    color:#24150f;

    padding:15px 25px;

    border-radius:30px;

    font-weight:bold;

    transition:.3s;
}

.btn-gold:hover{
    transform:translateY(-3px);
    box-shadow:0 10px 30px rgba(228,185,94,.25);
}

.btn-outline{
    display:inline-block;

    border:1px solid #e4b95e;
    color:#e4b95e;

    padding:15px 25px;

    border-radius:30px;

    transition:.3s;
}

.btn-outline:hover{
    background:#e4b95e;
    color:#24150f;
}


/* =========================
   HERO DECORATION
========================= */

.hero-dish{
    position:absolute;

    right:8%;
    top:50%;

    transform:translateY(-50%);

    width:390px;
    height:390px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            #fff7df 0 38%,
            #e4b95e 39% 42%,
            #422419 43% 67%,
            #24130d 68%
        );

    box-shadow:
        0 0 80px rgba(228,185,94,.15),
        inset 0 0 30px rgba(0,0,0,.25);

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:110px;
}

.hero-dish::before{
    content:"🍖";
    position:absolute;
    top:90px;
    left:90px;
    transform:rotate(-15deg);
}

.hero-dish::after{
    content:"🥚";
    position:absolute;
    bottom:85px;
    right:80px;
    transform:rotate(12deg);
}


/* =========================
   INTRO
========================= */

.intro{
    padding:70px 8%;

    background:#fff;

    display:grid;
    grid-template-columns:repeat(3,1fr);

    gap:25px;
}

.intro-card{
    text-align:center;

    padding:30px 20px;

    border:1px solid #eadfce;
    border-radius:15px;

    background:#fffdf9;

    transition:.3s;
}

.intro-card:hover{
    transform:translateY(-5px);

    box-shadow:0 15px 40px rgba(57,34,21,.08);
}

.intro-icon{
    font-size:38px;
    margin-bottom:15px;
}

.intro-card h3{
    font-family:Georgia,serif;
    font-size:21px;
    margin-bottom:8px;
}

.intro-card p{
    color:#777;
    font-size:13px;
    line-height:1.7;
}


/* =========================
   SECTION
========================= */

section{
    padding:90px 8%;
}

.section-heading{
    text-align:center;
    margin-bottom:50px;
}

.section-label{
    color:#9a642c;

    font-size:12px;
    font-weight:bold;

    letter-spacing:4px;
}

.section-heading h2{
    font-family:Georgia,serif;

    font-size:44px;

    margin:10px 0;
}

.section-heading p{
    color:#777;
}


/* =========================
   MENU
========================= */

.menu{
    background:#f8f3ea;
}

.menu-grid{
    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:25px;
}

.food-card{
    overflow:hidden;

    background:#fff;

    border-radius:18px;

    border:1px solid #e9dece;

    transition:.35s;
}

.food-card:hover{
    transform:translateY(-7px);
    box-shadow:
        0 20px 45px
        rgba(56,31,18,.12);
}

.food-visual{
    height:220px;

    position:relative;

    display:flex;
    align-items:center;
    justify-content:center;

    overflow:hidden;

    background:
        radial-gradient(
            circle,
            #fff4d8,
            #e5c98c
        );
}

.food-visual::before{
    content:"";

    position:absolute;

    width:170px;
    height:170px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            #fffdf3 0 54%,
            #c49345 55% 61%,
            #392117 62%
        );

    box-shadow:
        0 15px 25px rgba(0,0,0,.2);
}

.food-emoji{
    position:relative;
    z-index:2;

    font-size:76px;

    filter:drop-shadow(
        0 8px 5px rgba(0,0,0,.2)
    );
}

.food-tag{
    position:absolute;

    top:15px;
    left:15px;

    z-index:5;

    background:#24150f;
    color:#e4b95e;

    padding:7px 11px;

    border-radius:20px;

    font-size:10px;
    font-weight:bold;
}

.food-info{
    padding:23px;
}

.food-info h3{
    font-family:Georgia,serif;

    font-size:22px;

    margin-bottom:8px;
}

.food-info p{
    color:#777;

    font-size:13px;
    line-height:1.7;

    min-height:44px;
}

.food-bottom{
    margin-top:18px;

    display:flex;
    align-items:center;
    justify-content:space-between;
}

.price{
    color:#9a5c25;

    font-size:19px;
    font-weight:bold;
}

.add-button{
    border:0;

    background:#2b1810;
    color:#fff;

    padding:10px 16px;

    border-radius:25px;

    cursor:pointer;

    transition:.3s;
}

.add-button:hover{
    background:#a5682d;
}


/* =========================
   ABOUT
========================= */

.about{
    background:#fff;

    display:grid;
    grid-template-columns:1fr 1fr;

    gap:70px;

    align-items:center;
}

.about-art{
    min-height:460px;

    border-radius:20px;

    background:
        radial-gradient(
            circle at 50% 45%,
            #f9e7b8,
            #c48b46 38%,
            #57321f 39% 55%,
            #23130d 56%
        );

    display:flex;
    justify-content:center;
    align-items:center;

    font-size:130px;

    box-shadow:
        20px 20px 0 #e4b95e;
}

.about-label{
    color:#9a642c;

    font-size:12px;
    letter-spacing:4px;
    font-weight:bold;
}

.about h2{
    font-family:Georgia,serif;

    font-size:45px;
    line-height:1.15;

    margin:12px 0 20px;
}

.about p{
    color:#666;

    line-height:1.9;

    margin-bottom:15px;
}

.check-list{
    margin-top:25px;
}

.check-list div{
    margin:10px 0;
    font-weight:500;
}

.check-list span{
    color:#a5662c;
    margin-right:8px;
}


/* =========================
   REVIEWS
========================= */

.reviews{
    background:#24150f;
    color:#fff;
}

.reviews .section-heading h2{
    color:#fff;
}

.reviews .section-heading p{
    color:#bbb;
}

.review-grid{
    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:25px;
}
    .review-card{
    padding:28px;

    background:#342019;

    border:1px solid rgba(228,185,94,.15);

    border-radius:16px;
}

.stars{
    color:#e4b95e;

    font-size:18px;

    margin-bottom:15px;
}

.review-card p{
    color:#ddd;

    line-height:1.8;

    font-size:14px;
}

.reviewer{
    margin-top:20px;

    color:#e4b95e;

    font-weight:bold;
}


/* =========================
   CONTACT
========================= */

.contact{
    background:#f8f3ea;

    text-align:center;
}

.contact-box{
    max-width:850px;

    margin:auto;

    padding:55px 30px;

    border-radius:20px;

    background:
        linear-gradient(
            135deg,
            #24150f,
            #432619
        );

    color:#fff;

    box-shadow:
        0 20px 50px rgba(50,28,16,.15);
}

.contact-box h2{
    font-family:Georgia,serif;

    font-size:38px;

    margin-bottom:15px;
}

.contact-box p{
    color:#ccc;

    margin:8px 0;
}

.contact-buttons{
    margin-top:25px;

    display:flex;

    justify-content
